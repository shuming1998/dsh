name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: package:win
            artifacts: |
              dist/*.exe
          # Apple Silicon. Standard hosted image; do not use a "-us-xl" label.
          - name: macOS arm64
            os: macos-14
            script: package:mac:arm64
            artifacts: |
              dist/*.dmg
              dist/*.zip
          # Intel. If this label is unavailable on the account, use macos-13.
          - name: macOS x64
            os: macos-15-intel
            script: package:mac:x64
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - name: Linux x64
            os: ubuntu-latest
            script: package:linux:x64
            artifacts: |
              dist/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot

      - name: Install dependencies
        run: npm ci

      # The Electron binary is not installed by `npm ci` in this repository.
      - name: Install Electron
        run: npm run electron:install

      - name: Package
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 7
